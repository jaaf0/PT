# engagement.conf — engagement settings (NO real IPs here; safe to commit).
# Targets live in a LOCAL, git-ignored file you create on your tester host.

ENGAGEMENT_NAME="ERP-ENGAGEMENT"

# Path to your local targets file (git-ignored). Format: one "NAME IP" per line.
# Create it from tools/targets.sample — see tools/README.md.
TARGETS_FILE="${TARGETS_FILE:-scope/targets.local}"

# Optionally run the test node first; set to its IP in your LOCAL env if desired.
TEST_FIRST="${TEST_FIRST:-}"

OUTDIR="${OUTDIR:-engagement}"

# Gentle timing for fragile production ERP. Do NOT raise to -T4/-T5.
TIMING="-T2 --max-rate 60 --max-retries 1 --host-timeout 20m --scan-delay 15ms"

TESTER="${USER:-tester}"
